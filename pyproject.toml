[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RET", "PT", "RUF"]
ignore = ["E501", "RUF012", "PT018"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.luz_indexada"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/luz_indexada"]

[tool.coverage.report]
fail_under = 95
show_missing = true
